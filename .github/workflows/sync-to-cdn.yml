name: Sync assets on CDN

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sync-to-cdn
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master

      - name: sync to S3
        uses: docker://rclone/rclone:1.75.1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          RCLONE_CONFIG_TARGET_TYPE: s3
          RCLONE_CONFIG_TARGET_PROVIDER: AWS
          RCLONE_CONFIG_TARGET_ENV_AUTH: true
          RCLONE_CONFIG_TARGET_ACL: public-read
        with:
          args: sync build/ target:${{ secrets.AWS_S3_BUCKET }} --checksum --fast-list --verbose

      - name: sync to R2
        uses: docker://rclone/rclone:1.75.1
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: true
        with:
          args: sync build/ r2:cdn-0 --checksum --fast-list --verbose
